name: Update Deck Performance

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deck-performance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ranking/requirements.txt
      - run: pip install -r scripts/ranking/requirements.txt
      - name: Check model and data guards
        run: python -m unittest discover -s tests/ranking -v
      - name: Fetch complete event history and build feed
        run: |
          python scripts/ranking/fetch_events.py --output build/performance-snapshot --days 180
          python scripts/ranking/build.py --snapshot build/performance-snapshot/events.json --output deck-performance.json --days 180 --audit build/excluded-events.json
      - name: Retain source and exclusion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-source-${{ github.run_id }}
          path: build/
          retention-days: 14
      - name: Publish successful update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deck-performance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update adjusted deck performance'
          git pull --rebase origin main
          git push origin HEAD:main
